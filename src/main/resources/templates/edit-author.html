<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Author - Library Management System</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<header>
    <div class="header-container">
        <a href="/books" class="brand-logo">
            <svg viewBox="0 0 24 24"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3z M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg>
            <h1>Library System</h1>
        </a>
        <nav>
            <a href="/books">📚 Books</a>
            <a href="/authors" class="active">✍️ Authors</a>
            <a href="/members">👥 Members</a>
        </nav>
    </div>
</header>

<div class="container" style="max-width: 600px;">

    <div class="page-header">
        <div>
            <h2>Edit Author</h2>
            <p>Update author details for ID #<span th:text="${author.id}">1</span></p>
        </div>
        <a href="/authors" class="btn btn-secondary">← Back to Authors</a>
    </div>

    <div class="card">
        <form th:action="@{/authors/update/{id}(id=${author.id})}" th:object="${author}" method="post">

            <div class="form-group">
                <label for="name">Author Name</label>
                <input type="text" id="name" th:field="*{name}" required>
            </div>

            <div class="form-group">
                <label for="email">Author Email</label>
                <input type="email" id="email" th:field="*{email}" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn">Update Author</button>
                <a href="/authors" class="btn btn-secondary">Cancel</a>
            </div>

        </form>
    </div>

</div>

<footer>
    <p>&copy; 2026 Library Management System. Simple &amp; Fast.</p>
</footer>

</body>
</html>
